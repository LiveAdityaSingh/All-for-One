<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.62 0.13 75); }
    a:hover { color: oklch(0.70 0.13 75); }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 412px; min-height: 620px; background: oklch(0.18 0 0); color: oklch(0.93 0 0); font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 0 14px 0; flex-grow: 1;">

    <div style="padding: 0 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <div>
        <div style="font-size: 24px; font-weight: 600; color: oklch(0.62 0.13 75); line-height: 1.1;">Tony</div>
        <div style="font-size: 12px; color: oklch(0.68 0 0);">Neutral &middot; no warm cast</div>
      </div>
      <div style="font-size: 10px; color: oklch(0.68 0 0); text-align: right;">oklch(0.18 0 0)</div>
    </div>

    <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid oklch(0.3 0 0); border-radius: 16px; background: oklch(0.23 0 0); padding: 12px 0;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px;">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.68 0 0);">ACTIVE</div>
        <div style="font-size: 18px; font-weight: 600;">12</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px; border-left: 1px solid oklch(0.3 0 0); border-right: 1px solid oklch(0.3 0 0);">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.68 0 0);">INTERVIEWING</div>
        <div style="font-size: 18px; font-weight: 600;">3</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px;">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.68 0 0);">OFFERS</div>
        <div style="font-size: 18px; font-weight: 600;">1</div>
      </div>
    </div>

    <div style="margin: 0 16px; display: flex; align-items: center; gap: 12px; border: 1px solid oklch(0.62 0.052 75); border-radius: 16px; padding: 16px; background: color-mix(in oklch, oklch(0.62 0.13 75) 8%, transparent);">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, oklch(0.62 0.13 75) 22%, transparent);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 75)" stroke-width="1.6" stroke-linejoin="round">
          <path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z" />
        </svg>
      </div>
      <div style="min-width: 0; flex-grow: 1;">
        <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: oklch(0.68 0 0);">PIPELINE PULSE</div>
        <div style="font-size: 14px; font-weight: 600; color: oklch(0.62 0.13 75);">4 of 12 replied</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid oklch(0.3 0 0); border-radius: 12px; padding: 12px; background: oklch(0.23 0 0);">
        <div style="min-width: 0;">
          <div style="font-size: 15px; font-weight: 600;">Monzo</div>
          <div style="font-size: 12px; color: oklch(0.68 0 0);">Senior Backend Engineer</div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 5px;">
            <span style="width: 7px; height: 7px; border-radius: 9999px; background: oklch(0.6 0.19 25);"></span>
            <span style="font-size: 12px; color: oklch(0.6 0.19 25);">Overdue by 3 days</span>
          </div>
        </div>
        <div style="flex-shrink: 0; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 500; background: color-mix(in oklch, oklch(0.62 0.13 75) 18%, transparent); color: oklch(0.62 0.13 75);">Final stage</div>
      </div>

      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid oklch(0.3 0 0); border-radius: 12px; padding: 12px; background: oklch(0.21 0 0);">
        <div style="min-width: 0;">
          <div style="font-size: 15px; font-weight: 600; color: oklch(0.55 0 70);">Initech</div>
          <div style="font-size: 12px; color: oklch(0.55 0 70);">ML Engineer &middot; 24 days ago</div>
        </div>
        <div style="flex-shrink: 0; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 500; background: oklch(0.28 0 70); color: oklch(0.68 0 0);">Any news on this?</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 12px 16px;">
    <div style="flex-grow: 1; border: 1px solid oklch(0.3 0 0); border-radius: 9999px; background: oklch(0.23 0 0); padding: 11px 16px; font-size: 14px; color: oklch(0.68 0 0);">e.g. applied to Acme for Data Scientist</div>
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: oklch(0.62 0.052 155); display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.18 0 0)" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0" /><path d="M12 19v3" />
      </svg>
    </div>
  </div>

  <div style="display: flex; align-items: stretch; border-top: 1px solid oklch(0.3 0 0); background: oklch(0.23 0 0);">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" /><path d="M2 13h20" />
      </svg>
      <span style="font-size: 14px; font-weight: 600; color: oklch(0.62 0.13 75);">Tony</span>
      <span style="width: 4px; height: 4px; border-radius: 9999px; background: oklch(0.62 0.13 75);"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 250)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 250);">Lisa</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 155)" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.2" /><ellipse cx="12" cy="12" rx="10" ry="4.5" /><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)" /><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 155);">Jarvis</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 300)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0 0 4h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5" /><circle cx="17" cy="13" r="1.2" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 300);">Vanessa</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 15)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.5-1.6 2-3 2-4.7A4.8 4.8 0 0 0 12 6.5 4.8 4.8 0 0 0 3 9.3c0 1.7.5 3.1 2 4.7l7 7z" /><path d="M3.5 12h4l1.5-3 2 5 1.5-2h6" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 15);">Marco</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
