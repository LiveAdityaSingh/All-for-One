<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.62 0.13 75); }
    a:hover { color: oklch(0.70 0.13 75); }
    * { box-sizing: border-box; }
  </style>
</helmet>

<!--
  The same refined slate taken further: a deeper ground so light has somewhere
  to fall off to, and a second source - the active agent's own hue washing up
  from behind the pulse card. The agent tints the room they are in, which is
  the colour system doing work rather than decoration.
-->
<div style="position: relative; width: 412px; min-height: 620px; background: oklch(0.125 0.012 268); color: oklch(0.94 0.008 268); font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(115% 55% at 50% -6%, oklch(0.28 0.045 268) 0%, transparent 60%);"></div>
  <!-- Agent wash: amber, low and wide, sitting behind the insight card. -->
  <div style="position: absolute; left: 0; right: 0; top: 130px; height: 240px; pointer-events: none; background: radial-gradient(70% 100% at 50% 40%, color-mix(in oklch, oklch(0.62 0.13 75) 16%, transparent) 0%, transparent 70%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px 0 14px 0; flex-grow: 1;">

    <div style="padding: 0 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <div>
        <div style="font-size: 24px; font-weight: 600; color: oklch(0.68 0.13 75); line-height: 1.1; text-shadow: 0 0 26px color-mix(in oklch, oklch(0.62 0.13 75) 70%, transparent);">Tony</div>
        <div style="font-size: 12px; color: oklch(0.70 0.008 268);">Cool slate &middot; luminous</div>
      </div>
      <div style="font-size: 10px; color: oklch(0.70 0.008 268); text-align: right;">oklch(0.125 0.012 268)</div>
    </div>

    <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid oklch(0.29 0.014 268); border-radius: 16px; background: oklch(0.185 0.012 268); padding: 12px 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 28px -18px rgba(0, 0, 0, 0.9);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px;">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.70 0.008 268);">ACTIVE</div>
        <div style="font-size: 18px; font-weight: 600;">12</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px; border-left: 1px solid oklch(0.29 0.014 268); border-right: 1px solid oklch(0.29 0.014 268);">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.70 0.008 268);">INTERVIEWING</div>
        <div style="font-size: 18px; font-weight: 600;">3</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 8px;">
        <div style="font-size: 10px; letter-spacing: 0.08em; color: oklch(0.70 0.008 268);">OFFERS</div>
        <div style="font-size: 18px; font-weight: 600;">1</div>
      </div>
    </div>

    <div style="margin: 0 16px; display: flex; align-items: center; gap: 12px; border: 1px solid color-mix(in oklch, oklch(0.62 0.13 75) 55%, transparent); border-radius: 16px; padding: 16px; background: color-mix(in oklch, oklch(0.62 0.13 75) 13%, oklch(0.185 0.012 268)); box-shadow: 0 0 52px -14px color-mix(in oklch, oklch(0.62 0.13 75) 100%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.09);">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, oklch(0.62 0.13 75) 30%, transparent); box-shadow: 0 0 24px -4px color-mix(in oklch, oklch(0.62 0.13 75) 90%, transparent);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.13 75)" stroke-width="1.6" stroke-linejoin="round">
          <path d="M12 3l1.9 5.4L19 10l-5.1 1.6L12 17l-1.9-5.4L5 10l5.1-1.6z" />
        </svg>
      </div>
      <div style="min-width: 0; flex-grow: 1;">
        <div style="font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: oklch(0.72 0.02 75);">PIPELINE PULSE</div>
        <div style="font-size: 14px; font-weight: 600; color: oklch(0.72 0.13 75); text-shadow: 0 0 18px color-mix(in oklch, oklch(0.62 0.13 75) 60%, transparent);">4 of 12 replied</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid oklch(0.29 0.014 268); border-radius: 12px; padding: 12px; background: oklch(0.185 0.012 268); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 28px -18px rgba(0, 0, 0, 0.9);">
        <div style="min-width: 0;">
          <div style="font-size: 15px; font-weight: 600;">Monzo</div>
          <div style="font-size: 12px; color: oklch(0.70 0.008 268);">Senior Backend Engineer</div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 5px;">
            <span style="width: 7px; height: 7px; border-radius: 9999px; background: oklch(0.65 0.19 25); box-shadow: 0 0 14px color-mix(in oklch, oklch(0.6 0.19 25) 100%, transparent);"></span>
            <span style="font-size: 12px; color: oklch(0.68 0.19 25);">Overdue by 3 days</span>
          </div>
        </div>
        <div style="flex-shrink: 0; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 500; background: color-mix(in oklch, oklch(0.62 0.13 75) 22%, transparent); color: oklch(0.74 0.13 75);">Final stage</div>
      </div>

      <!-- No highlight, no shadow, no glow. The light has gone out of it. -->
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border: 1px solid oklch(0.22 0.005 268); border-radius: 12px; padding: 12px; background: oklch(0.15 0.004 268);">
        <div style="min-width: 0;">
          <div style="font-size: 15px; font-weight: 600; color: oklch(0.52 0 70);">Initech</div>
          <div style="font-size: 12px; color: oklch(0.52 0 70);">ML Engineer &middot; 24 days ago</div>
        </div>
        <div style="flex-shrink: 0; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 500; background: oklch(0.24 0 70); color: oklch(0.66 0 70);">Any news on this?</div>
      </div>
    </div>
  </div>

  <div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 0 16px 12px 16px;">
    <div style="flex-grow: 1; border: 1px solid oklch(0.29 0.014 268); border-radius: 9999px; background: oklch(0.185 0.012 268); padding: 11px 16px; font-size: 14px; color: oklch(0.70 0.008 268); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);">e.g. applied to Acme for Data Scientist</div>
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: oklch(0.62 0.09 155); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 26px -4px color-mix(in oklch, oklch(0.62 0.13 155) 95%, transparent);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.125 0.012 268)" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0" /><path d="M12 19v3" />
      </svg>
    </div>
  </div>

  <div style="position: relative; display: flex; align-items: stretch; border-top: 1px solid oklch(0.29 0.014 268); background: oklch(0.16 0.012 268); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.13 75)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 10px color-mix(in oklch, oklch(0.62 0.13 75) 90%, transparent));">
        <rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" /><path d="M2 13h20" />
      </svg>
      <span style="font-size: 14px; font-weight: 600; color: oklch(0.72 0.13 75);">Tony</span>
      <span style="width: 4px; height: 4px; border-radius: 9999px; background: oklch(0.72 0.13 75); box-shadow: 0 0 8px oklch(0.62 0.13 75);"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 250)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 250);">Lisa</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 155)" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.2" /><ellipse cx="12" cy="12" rx="10" ry="4.5" /><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)" /><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(120 12 12)" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 155);">Jarvis</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 300)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0 0 4h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5" /><circle cx="17" cy="13" r="1.2" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 300);">Vanessa</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.13 15)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.5-1.6 2-3 2-4.7A4.8 4.8 0 0 0 12 6.5 4.8 4.8 0 0 0 3 9.3c0 1.7.5 3.1 2 4.7l7 7z" /><path d="M3.5 12h4l1.5-3 2 5 1.5-2h6" />
      </svg>
      <span style="font-size: 14px; color: oklch(0.62 0.13 15);">Marco</span>
      <span style="width: 4px; height: 4px;"></span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
